services:
  ovms:
    image: openvino/model_server:2026.3-gpu
    user: "${LOCAL_UID}:${LOCAL_GID}"

    devices:
      - /dev/dxg:/dev/dxg

    volumes:
      - /usr/lib/wsl:/usr/lib/wsl:ro
      - ./models:/models:rw

    ports:
      - "127.0.0.1:8000:8000"

    command:
      - --rest_port
      - "8000"
      - --model_repository_path
      - /models
      - --source_model
      - OpenVINO/Qwen3.5-4B-int4-ov
      - --model_name
      - qwen3-5-4b
      - --task
      - text_generation
      - --target_device
      - GPU
      - --pipeline_type
      - VLM_CB
      - --enable_prefix_caching
      - "false"
      - --plugin_config
      - '{"GPU_ENABLE_LARGE_ALLOCATIONS":"YES"}'
      - --tool_parser
      - qwen3coder

    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.10.2

    ports:
      - "127.0.0.1:3000:8080"

    volumes:
      - open-webui-data:/app/backend/data

    environment:
      - FILE_IMAGE_COMPRESSION_WIDTH=800
      - FILE_IMAGE_COMPRESSION_HEIGHT=800
      - ENABLE_TITLE_GENERATION=false
      - ENABLE_FOLLOW_UP_GENERATION=false
      - ENABLE_TAGS_GENERATION=false
      - ENABLE_AUTOCOMPLETE_GENERATION=false
      - 'DEFAULT_MODEL_METADATA={"capabilities":{"builtin_tools":false}}'
      - 'DEFAULT_MODEL_PARAMS={"custom_params":{"chat_template_kwargs":{"enable_thinking":false}}}'
      - OPENAI_API_BASE_URL=http://ovms:8000/v3
      - 'TOOL_SERVER_CONNECTIONS=[{"type":"mcp","url":"http://expense-assistant-mcp:8100/mcp","auth_type":"none","key":"","config":{"enable":true},"info":{"id":"expense_assistant_mcp","name":"EexpenseAssistantMCP","description":"経費処理用MCPサーバー"}}]'
      - 'DEFAULT_INTERFACE_SETTINGS={"system":"経費科目の判定や経費登録に関する依頼を受けた場合は、必ず最初に EexpenseAssistantMCP の get_expense_processing_workflow を呼び出してください。"}'

    depends_on:
      - ovms

    restart: unless-stopped

  expense-assistant-mcp:
    build:
      context: ./expense-assistant-mcp-server-spring-ai-example
    ports:
      - "127.0.0.1:8101:8100"
    restart: unless-stopped

volumes:
  open-webui-data:

